name: Build Android APK with Firebase

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Generate Framework and Setup Firebase
        run: |
          # 1. Generate clean Android template project with your exact package name (com.fikrapro.app)
          flutter create temp_app --org com.fikrapro --project-name app
          cp -r temp_app/android ./
          rm -rf temp_app

          # 2. Copy google-services.json into the Android app directory
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/
            echo "google-services.json successfully applied!"
          else
            echo "WARNING: google-services.json not found in root repository."
          fi

          # 3. Configure Gradle settings for Google Services plugin
          SETTINGS_FILE="android/settings.gradle"
          if [ -f "$SETTINGS_FILE" ]; then
            python3 -c "
            with open('$SETTINGS_FILE', 'r') as f:
                content = f.read()
            if 'google-services' not in content:
                content = content.replace('plugins {', 'plugins {\n    id \"com.google.gms.google-services\" version \"4.4.2\" apply false')
                with open('$SETTINGS_FILE', 'w') as f:
                    f.write(content)
            "
          fi

          APP_BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$APP_BUILD_GRADLE" ]; then
            echo "apply plugin: 'com.google.gms.google-services'" >> "$APP_BUILD_GRADLE"
          fi

          # 4. Insert AndroidManifest.xml WITH INTERNET PERMISSION & AdMob config
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <!-- CRITICAL: Internet permission required for Firebase, Ads, and Images -->
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>

              <application
                  android:label="Fikra Pro"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">

                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-3940256099942544~3375012500"/>

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          # 5. Create pubspec.yaml with all dependencies and assets
          cat << 'EOF' > pubspec.yaml
          name: fluter_new
          description: "Fikra Pro App"
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.6
            firebase_core: ^2.27.0
            firebase_database: ^10.4.0
            google_mobile_ads: ^8.0.0
            cached_network_image: ^3.3.1
            intl: ^0.19.0
            url_launcher: ^6.2.5

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0
            flutter_launcher_icons: ^0.13.1

          flutter:
            uses-material-design: true
            assets:
              - assets/images/s.png
              - assets/images/s1.png
              - assets/images/s2.png

          flutter_launcher_icons:
            image_path: "assets/images/s.png"
            android: true
            ios: false
            min_sdk_android: 21
          EOF

      - name: Auto-Fix Code Typos & Build App
        run: |
          # Automatically fix code typos
          find lib/ -type f -name "*.dart" -exec sed -i 's/MainAxisAlignment\.between/MainAxisAlignment\.spaceBetween/g' {} +
          find lib/ -type f -name "*.dart" -exec sed -i 's/const RichText(/RichText(/g' {} +

          # Set app display name to Fikra Pro
          STRING_FILE="android/app/src/main/res/values/strings.xml"
          mkdir -p android/app/src/main/res/values
          echo '<resources><string name="app_name">Fikra Pro</string></resources>' > "$STRING_FILE"

          # Install packages and generate launcher icons
          flutter pub get
          flutter pub run flutter_launcher_icons

          # Build Release APK
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

name: Build Android APK with Firebase

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Generate Native Framework and Apply Firebase
        run: |
          # 1. Re-generate clean Android framework with package com.fikrapro.app
          flutter create temp_app --org com.fikrapro --project-name app
          cp -r temp_app/android ./
          rm -rf temp_app

          # 2. Check and copy google-services.json
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/
            echo "SUCCESS: google-services.json applied!"
          else
            echo "ERROR: google-services.json missing!"
            exit 1
          fi

          # 3. Configure Android build.gradle with MultiDex & Minimum SDK 21
          APP_GRADLE="android/app/build.gradle"
          if [ -f "$APP_GRADLE" ]; then
            python3 -c "
            with open('$APP_GRADLE', 'r') as f:
                content = f.read()
            
            # Enable MultiDex and set minSdk 21
            content = content.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21\n        multiDexEnabled true')
            
            # Apply Google Services plugin at the bottom
            if 'com.google.gms.google-services' not in content:
                content += '\napply plugin: \"com.google.gms.google-services\"\n'
                
            with open('$APP_GRADLE', 'w') as f:
                f.write(content)
            "
          fi

          # 4. Configure Android settings.gradle for Google Services Plugin
          SETTINGS_FILE="android/settings.gradle"
          if [ -f "$SETTINGS_FILE" ]; then
            python3 -c "
            with open('$SETTINGS_FILE', 'r') as f:
                content = f.read()
            if 'google-services' not in content:
                content = content.replace('plugins {', 'plugins {\n    id \"com.google.gms.google-services\" version \"4.4.2\" apply false')
                with open('$SETTINGS_FILE', 'w') as f:
                    f.write(content)
            "
          fi

          # 5. Overwrite AndroidManifest.xml with Native AdMob Application ID & Internet Permissions
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>

              <application
                  android:label="Fikra Pro"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">

                  <!-- REQUIRED BY GOOGLE MOBILE ADS SDK: App will crash on boot without this -->
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-3940256099942544~3375012500"/>

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          # 6. Generate pubspec.yaml
          cat << 'EOF' > pubspec.yaml
          name: fluter_new
          description: "Fikra Pro App"
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.6
            firebase_core: ^2.27.0
            firebase_database: ^10.4.0
            google_mobile_ads: ^8.0.0
            cached_network_image: ^3.3.1
            intl: ^0.19.0
            url_launcher: ^6.2.5

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0
            flutter_launcher_icons: ^0.13.1

          flutter:
            uses-material-design: true
            assets:
              - assets/images/s.png
              - assets/images/s1.png
              - assets/images/s2.png

          flutter_launcher_icons:
            image_path: "assets/images/s.png"
            android: true
            ios: false
            min_sdk_android: 21
          EOF

      - name: Build Native Release APK
        run: |
          # Set App Title
          mkdir -p android/app/src/main/res/values
          echo '<resources><string name="app_name">Fikra Pro</string></resources>' > android/app/src/main/res/values/strings.xml

          # Install packages & launcher icons
          flutter pub get
          flutter pub run flutter_launcher_icons

          # Clean build APK release binary
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

name: Build Android APK Automatically

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Generate Framework and Android Files
        run: |
          # 1. Generate clean Android template project
          flutter create temp_app --org com.fikra.pro --project-name fluter_new
          cp -r temp_app/android ./
          rm -rf temp_app

          # 2. Insert AndroidManifest.xml directly inside the workflow script
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Fikra Pro"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">

                  <!-- AdMob Application ID meta-data tag (Prevents native startup crash) -->
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-3940256099942544~3375012500"/>

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          # 3. Create pubspec.yaml with all dependencies and assets
          cat << 'EOF' > pubspec.yaml
          name: fluter_new
          description: "Fikra Pro App"
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.6
            firebase_core: ^2.27.0
            firebase_database: ^10.4.0
            google_mobile_ads: ^8.0.0
            cached_network_image: ^3.3.1
            intl: ^0.19.0
            url_launcher: ^6.2.5

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0
            flutter_launcher_icons: ^0.13.1

          flutter:
            uses-material-design: true
            assets:
              - assets/images/s.png
              - assets/images/s1.png
              - assets/images/s2.png

          flutter_launcher_icons:
            image_path: "assets/images/s.png"
            android: true
            ios: false
            min_sdk_android: 21
          EOF

      - name: Auto-Fix Code Typos & Configure App
        run: |
          # Automatically fix MainAxisAlignment.between -> MainAxisAlignment.spaceBetween across all files
          find lib/ -type f -name "*.dart" -exec sed -i 's/MainAxisAlignment\.between/MainAxisAlignment\.spaceBetween/g' {} +
          
          # Automatically fix invalid const RichText usages
          find lib/ -type f -name "*.dart" -exec sed -i 's/const RichText(/RichText(/g' {} +

          # Change string resources to "Fikra Pro"
          STRING_FILE="android/app/src/main/res/values/strings.xml"
          mkdir -p android/app/src/main/res/values
          echo '<resources><string name="app_name">Fikra Pro</string></resources>' > "$STRING_FILE"

          # Install packages and generate launcher icons
          flutter pub get
          flutter pub run flutter_launcher_icons

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

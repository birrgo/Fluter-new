name: Build Android APK Automatically

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Generate Project Framework & Config
        run: |
          # 1. Create a temporary flutter project to get clean config files
          flutter create temp_app --org com.fikra.pro --project-name fluter_new
          
          # 2. Copy the android configuration folders to your root repository
          cp -r temp_app/android ./
          
          # 3. Automatically create pubspec.yaml with all dependencies, assets, and icon config
          cat << 'EOF' > pubspec.yaml
          name: fluter_new
          description: "Fikra Pro App"
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.6
            firebase_core: ^2.27.0
            firebase_database: ^10.4.0
            google_mobile_ads: ^8.0.0
            cached_network_image: ^3.3.1
            intl: ^0.19.0
            url_launcher: ^6.2.5

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0
            flutter_launcher_icons: ^0.13.1

          flutter:
            uses-material-design: true
            assets:
              - assets/images/s.png
              - assets/images/s1.png
              - assets/images/s2.png

          flutter_launcher_icons:
            image_path: "assets/images/s.png"
            android: true
            ios: false
            min_sdk_android: 21
          EOF

          # 4. Clean up the temporary folder
          rm -rf temp_app

      - name: Fix Crashes, Typos, and Inject AdMob Config
        run: |
          # 1. Explicitly set Android display name to "Fikra Pro"
          STRING_FILE="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRING_FILE" ]; then
            sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Fikra Pro<\/string>/g' "$STRING_FILE"
          else
            mkdir -p android/app/src/main/res/values
            echo '<resources><string name="app_name">Fikra Pro</string></resources>' > "$STRING_FILE"
          fi

          # 2. Inject AdMob App ID into AndroidManifest.xml to prevent ad crashes
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            # Insert the meta-data right before the closing </application> tag
            sed -i '/<\/application>/i \    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3375012500"/>' "$MANIFEST_FILE"
          fi

          # 3. Fix common Dart code typos
          find lib/ -type f -name "*.dart" -exec sed -i 's/MainAxisAlignment\.between/MainAxisAlignment\.spaceBetween/g' {} +
          find lib/ -type f -name "*.dart" -exec sed -i 's/const RichText(/RichText(/g' {} +

          # 4. Make Firebase and AdMob initializations 100% crash-proof
          find lib/ -type f -name "main.dart" -exec sed -i 's/await Firebase.initializeApp();/try { await Firebase.initializeApp(); } catch (e) { print(e); }/g' {} +
          find lib/ -type f -name "main.dart" -exec sed -i 's/MobileAds.instance.initialize();/try { MobileAds.instance.initialize(); } catch (e) { print(e); }/g' {} +

          # 5. Install packages and generate launcher icons
          flutter pub get
          flutter pub run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

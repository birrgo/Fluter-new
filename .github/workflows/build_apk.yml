name: Build Android APK Automatically

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Generate Project Framework & Inject Config
        run: |
          # 1. Create a temporary flutter project to get clean config files
          flutter create temp_app --org com.fikra.pro --project-name fluter_new
          
          # 2. Copy the android configuration folders to your root repository
          cp -r temp_app/android ./
          
          # 3. Automatically create pubspec.yaml with ALL required dependencies (including url_launcher)
          cat << 'EOF' > pubspec.yaml
          name: fluter_new
          description: "Fikra Pro App"
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.6
            firebase_core: ^2.27.0
            firebase_database: ^10.4.0
            google_mobile_ads: ^8.0.0
            cached_network_image: ^3.3.1
            intl: ^0.19.0
            url_launcher: ^6.2.5

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

          # 4. Clean up the temporary folder
          rm -rf temp_app

      - name: Auto-fix Common Code Typos
        run: |
          # Fix MainAxisAlignment.between -> MainAxisAlignment.spaceBetween
          find lib/ -type f -name "*.dart" -exec sed -i 's/MainAxisAlignment\.between/MainAxisAlignment\.spaceBetween/g' {} +
          
          # Fix invalid const RichText usage
          find lib/ -type f -name "*.dart" -exec sed -i 's/const RichText(/RichText(/g' {} +

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
